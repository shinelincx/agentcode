name: image-scan

# C4 收尾：staging 基座镜像漏洞扫描。
# 本地网络无法拉取 trivy 漏洞库（mirror.gcr.io / registry-1.docker.io 不可达，
# ghcr.io 大 blob 超时），因此把扫描放到 runner 上执行；仅手动触发，不参与 push 门禁。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 river/infra/docker/Dockerfile、river/docker-compose.staging.yml 的 pin 保持一致
        image:
          # 2026-11-13 升级后的 pin（tag@digest，与 river 侧一致）
          - docker.m.daocloud.io/library/node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
          - docker.m.daocloud.io/library/nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          - docker.m.daocloud.io/library/postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    steps:
      - uses: actions/checkout@v4

      # 只记录不拦截：首轮目标是量出 HIGH/CRITICAL 清单，阈值策略待结果出来后单独定
      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
