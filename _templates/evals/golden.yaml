      design_content: |
        # DESIGN · task eval-proto
        ## 文件归属表
        | 路径 | lane |
        | --- | --- |
        | apps/api/src/audit.ts | be |
        | apps/web/src/Queue.tsx | fe |
        ## 实现策略
        - 原型：生成 | G2 核对布局与按钮显示状态。
        - 测试用按钮切换本地状态。
