        checks/test_existing.py: |
          import unittest
          from apps.api.导出 import summary

          class Existing(unittest.TestCase):
              def test_nonempty_stays_the_same(self):
                  self.assertEqual(summary(["甲", "乙"]), "甲\n乙")
      requirements: |
        # REQUIREMENTS
        ## 需求
        仅修改 apps/api/导出.py 的 summary，空输入返回 EMPTY-42，非空行为保持。
        ## 验收标准
        - AC-1: summary([]) 等于 "EMPTY-42"，非空保留换行连接。
        ## 非目标
        不修改既有测试。
      design: |
        # DESIGN
        ## 文件归属表
