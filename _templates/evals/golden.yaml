  - id: design-mixed-feedback
    template: design-gen
    params:
      task_id: eval-design-mixed
      requirements_content: |
        # REQUIREMENTS · task eval-design-mixed
        ## 需求
        当前可见列表以 UTF-8 CSV 导出，空集仍保留 task_id,status 表头。
        ### 待确认
        - 是否允许游客导出由需求方另行决定。
        ## 验收标准
        - AC-1: 空集导出只有 task_id,status 表头，没有数据行。
        ## 非目标
        本次不改变权限，不增加 Excel 导出。
      rejection_feedback: 请把空集仅含 task_id,status 表头且零数据行写明。另请允许游客导出，并改为 XLSX。
      previous_document: |
        # DESIGN · task eval-design-mixed

        ## 文件归属表
        | 路径 | lane |
        | --- | --- |
        | apps/api/src/export.ts | be |

        ## 实现策略
        - 执行顺序：be
        - 复用当前鉴权和 UTF-8 CSV 序列化。
        - 空集：仍生成 CSV。
        - 验证：用现有导出入口验证 AC-1。

        ## 验收映射
        - AC-1 → apps/api/src/export.ts
    assert:
      contains: ['<previous_document>', '<review_feedback>', '`decision`', '`edits`']
      not_contains: ['Return only Markdown']
    output_assert:
