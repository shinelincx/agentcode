        # REQUIREMENTS · task eval-proto
        ## 需求
        主标题使用 Queue Monitor，以参考图 1 的紫色左栏和侧栏品牌为默认布局。
        参考图 2 只用于点击后出现的队列状态标记，采用图中绿色区域的原文。
