      not_contains: ['<review_feedback>', '<previous_document>', '`decision`']
      max_chars: 7000
    output_assert:
      contains: ["## 文件归属表", "## 实现策略", "## 验收映射"]
      min_matches: {'(?m)^\s*(?:-\s+)?AC-\d+\s*(?:→|->)\s*\S': 2}
