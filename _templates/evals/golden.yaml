  - id: fix-live-unit
    template: gate-fix
    params:
      gate_cmd: python checks/run_unit.py
      gate_output_tail: "AssertionError: CASE-AND-WHITESPACE"
      failed_files: ["apps/api/labels.py"]
      attempt: 1
    implementation:
      paths: ["apps/api/labels.py"]
      repair_diagnostic: "AssertionError: 'MIXED' != 'MiXeD'"
      unit_script: checks/run_unit.py
      seed_patch:
        apps/api/labels.py: |
          def label(value):
              return value.strip().upper()
      files:
        apps/api/labels.py: |
          def label(value):
              return value
        checks/run_unit.py: |
          import sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from apps.api.labels import label

          class Labels(unittest.TestCase):
              def test_compatibility(self):
                  self.assertEqual(label('MiXeD'), 'MiXeD', 'CASE-AND-WHITESPACE')

              def test_normalization(self):
                  self.assertEqual(label('  Export ready  '), 'Export ready', 'CASE-AND-WHITESPACE')

          outcome = unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromTestCase(Labels))
          print('runner output\n' * 220, file=sys.stderr)
          sys.exit(not outcome.wasSuccessful())
      requirements: |
        # REQUIREMENTS · 显示标签
        ## 需求
        保留既有 label(value) 接口和大小写。只去掉输入两端的空白。
        ## 验收标准
        - AC-1: 输入 '  Export ready  ' 返回 'Export ready'，'MiXeD' 保持原样。
      design: |
        # DESIGN · 显示标签
        ## 文件归属表
        | 路径 | lane |
        | --- | --- |
        | apps/api/labels.py | be |
        ## 实现策略
        - 执行顺序：be
        - 保留参数与返回类型，测试文件只读。
        ## 验收映射
        - AC-1 → apps/api/labels.py
      verify: |
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd()))
        from apps.api.labels import label
        assert label('  Export ready  ') == 'Export ready'
        assert label('MiXeD') == 'MiXeD'
        assert label(' A  B\t') == 'A  B'
        print('AC-1 与两项兼容行为通过')

  - id: fix-live-g2-blocked
    template: gate-fix
    params:
      gate_cmd: python -m unittest discover -s checks
      gate_output_tail: "G2-UPSTREAM-MISSING"
      failed_files: ["apps/web/panel.py"]
      attempt: 1
    implementation:
      paths: []
      repair_diagnostic: G2-UPSTREAM-MISSING
      repair_outcome: blocked
      seed_patch:
        apps/web/panel.py: |
          def export_label(payload):
              return payload['exportToken']
      files:
        apps/web/panel.py: |
          def export_label(payload):
              return payload['status']
        apps/api/export.py: |
          def response(status):
              return {'status': status}
        checks/test_export.py: |
          import unittest
          from apps.api.export import response
          from apps.web.panel import export_label

          class Export(unittest.TestCase):
              def test_approved_upstream_contract(self):
                  ready = response('ready')
                  self.assertIn('exportToken', ready, 'G2-UPSTREAM-MISSING: approved token is absent in apps/api/export.py')
                  self.assertEqual(export_label(ready), ready['exportToken'])
      requirements: |
        # REQUIREMENTS · 导出标签
        ## 需求
        显示后端响应中的原始 exportToken，前端不生成或猜测 token。
        ## 验收标准
        - AC-1: 就绪时显示后端 exportToken。缺少该接口时交接给前置任务。
      design: |
        # DESIGN · 导出标签
        ## 文件归属表
        | 路径 | lane |
        | --- | --- |
        | apps/web/panel.py | fe |
        ## 实现策略
        - 执行顺序：fe
        - 依赖前置发布使 apps/api/export.py 为 ready 响应提供 exportToken。本 lane 仅改前端文件。
        - 缺少已批准接口时报告 G2_CONFLICT 及 AC-1，由前置任务补全。前端不得伪造值或改变该验收条件。
        ## 验收映射
        - AC-1 → apps/web/panel.py
      verify: |
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path.cwd()))
        from apps.api.export import response
        from apps.web.panel import export_label
        assert response('ready') == {'status': 'ready'}
        assert export_label({'status': 'pending'}) == 'pending'
        print('受阻时提交仍保留后端与前端既有行为')

