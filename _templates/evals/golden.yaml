  - id: impl-live-handoff
    template: implement-lane
    params:
      branch: feat/eval-be
      lane_instruction: 实现 G2 已批准的跨 lane 合成用例。
      scope: [apps/api/export.py]
    implementation:
      files:
        apps/api/export.py: |
          def response(status):
              return {"status": status}
        apps/web/panel.py: |
          def display(payload):
              return payload["status"]
        checks/test_existing.py: |
          import unittest
          from apps.api.export import response
          from apps.web.panel import display

          class Existing(unittest.TestCase):
              def test_api_retains_status(self):
                  self.assertEqual(response("ready")["status"], "ready")

              def test_panel_retains_plain_status_without_token(self):
                  self.assertEqual(display({"status": "pending"}), "pending")
      requirements: |
        # REQUIREMENTS
        ## 需求
        现有响应保留 status。只有 ready 状态增加 exportToken，前端读取可选的 exportToken 并显示在状态文案之后。
        ## 验收标准
        - AC-1: ready 响应等于 {"status": "ready", "exportToken": "READY-7"}，其他状态仍只有 status。
        - AC-2: display 收到 ready 和 READY-7 时返回 "ready / READY-7"，未收到 token 时维持原显示。
        ## 非目标
        不增加依赖，也不修改 checks/test_existing.py 中的兼容性测试。
      design: |
        # DESIGN
        ## 文件归属表
        | 路径 | lane |
        | --- | --- |
        | apps/api/export.py | be |
        | apps/web/panel.py | fe |
        ## 实现策略
        - 执行顺序：be → fe
        - be 在 response 内提供可选的 exportToken。fe 在 display 消费此前序接口，保留无 token 的分支。
        - 验证上述四种条件，并保留既有测试。交付评测另行验证两 lane 集成结果。
        ## 验收映射
        - AC-1 → apps/api/export.py
        - AC-2 → apps/web/panel.py
      paths: [apps/api/export.py, apps/web/panel.py]
      verify: |
        from pathlib import Path
        from unittest import TestLoader, TextTestRunner
        import sys
        sys.path.insert(0, str(Path.cwd()))
        from apps.api.export import response
        from apps.web.panel import display

        assert response("ready") == {"status": "ready", "exportToken": "READY-7"}
        assert response("waiting") == {"status": "waiting"}
        assert display(response("ready")) == "ready / READY-7"
        assert display(response("waiting")) == "waiting"
        result = TextTestRunner().run(TestLoader().discover("checks"))
        assert result.wasSuccessful() and result.testsRun == 2

  - id: impl-live-unicode
    template: implement-lane
    params:
      branch: feat/eval-be
      lane_instruction: 仅修改 apps/api/导出.py。
      scope: [apps/api/导出.py]
    implementation:
      files:
        apps/api/导出.py: |
