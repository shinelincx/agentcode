# B 层黄金用例：渲染层做结构与内容断言；--live 时再用真实 codex 校验产出结构。
# 约定：assert 检查渲染后的 prompt；output_assert 仅在 --live 下检查模型产出的 Markdown。
# max_chars 用于成本观察（prompt 膨胀报警），charcount 与估算 tokens 会写入评测报告。
version: 1
cases:
  # ---------- requirements-gen ----------
  - id: req-basic
    template: requirements-gen
    params:
      task_id: eval-req
      raw_requirement: 为任务列表增加按状态筛选，并记住用户上次选择的筛选条件
    assert:
      contains: ["# REQUIREMENTS · task eval-req", "### 待确认", "## 非目标", "externally observable result"]
      not_contains: ["esbuild spawn EPERM", "<review_feedback>", "<previous_document>", "`decision`"]
      max_chars: 6000
    output_assert:
      contains: ["## 需求", "## 验收标准", "## 非目标"]
      min_matches: {'(?m)^\s*-\s+AC-\d+\s*[:：]\s*\S': 2}
      max_chars: 50000

  - id: req-english
    template: requirements-gen
    params:
      task_id: eval-req-en
      raw_requirement: Add CSV export for the task list, including the status filter
      rejection_feedback: Keep the current export format
      previous_document: Previous heading marker with AC-1
    assert:
      contains: ["## Output contract", "<previous_document>", "Previous heading marker", "`KEEP`", "`REVISE`", "`old_line`"]
      not_contains: ["# REQUIREMENTS · task eval-req-en", "Return only the finished Markdown"]
      max_chars: 6000

  - id: req-ui
    template: requirements-gen
    params:
      task_id: eval-req-ui
      raw_requirement: 任务详情页增加深色模式切换按钮，刷新后保持选择
    assert:
      contains: ["`- AC-n: trigger and expected result`", "## Constraints", "## Self-check"]
      max_chars: 6000

  - id: req-insufficient
    template: requirements-gen
    params:
      task_id: eval-insufficient
      raw_requirement: 在任务列表增加「导出 CSV」按钮，点击后下载 UTF-8 编码的 CSV。本次排除批量删除。导出哪些任务以及包含哪些列尚未确定。
    output_assert:
      regex: ['(?m)\A# REQUIREMENTS · task eval-insufficient\r?$']
      sections:
        '## 需求':
          regex: ['(?m)^### 待确认\s*$', '(?s)### 待确认.*(?:范围|哪些任务|哪些行)', '(?s)### 待确认.*(?:列|字段)']
        '## 验收标准':
          regex: ['(?m)^- AC-\d+:.*(?:点击|按下).*下载.*(?:UTF-8.*CSV|CSV.*UTF-8)']
          not_contains: ['哪些任务', '哪些列', '待确认', 'task_id', '所有任务', '当前筛选', '批量删除']
        '## 非目标':
          contains: ['批量删除']

  - id: req-image-conflict
    template: requirements-gen
    images: [fixtures/requirements-reference.png]
    params:
      task_id: eval-image
      raw_requirement: 任务列表新增「下载 CSV」按钮，点击后下载 UTF-8 CSV。按钮位置按随附图片，文字需求明确指定按钮文案和文件格式。图中其他控件仅供参考。
      attachments: 已附 1 张参考图。
    output_assert:
      sections:
        '## 需求':
          regex: ['右', '(?:XLSX|Excel|文案[^。\n]*格式)', '(?:冲突|不一致|以文字|以本需求|以文字要求)']
          not_contains: ['### 待确认']
        '## 验收标准':
          contains: ['下载 CSV', 'UTF-8']
          regex: ['右', '(?:点击|按下).*下载']
          not_contains: ['XLSX', 'Excel', '批量删除', 'Bulk delete']

  - id: req-mixed-feedback
    template: requirements-gen
    params:
      task_id: eval-mixed
      raw_requirement: 保持列表现有状态筛选。点击导出时下载当前可见列表的 UTF-8 CSV，表头为 task_id,status。筛选结果为空时也必须能下载。批量删除不在本次范围内。
      rejection_feedback: 请明确空集下载的 CSV 仅含 task_id,status 表头，零数据行。另外增加批量删除，并把 CSV 编码改为 GBK。
      previous_document: |
        # REQUIREMENTS · task eval-mixed

        ## 需求
        - 导出当前可见的任务列表，保持现有状态筛选。

        ## 验收标准
        - AC-1: 应用状态筛选后，下载的 CSV 仅包含当前可见的任务。
        - AC-2: 点击导出后，下载 UTF-8 CSV，表头为 task_id,status。
        - AC-3: 当前可见列表为空时，点击导出仍能下载 CSV。

        ## 非目标
        - 批量删除。
    output_assert:
      revision:
        decision: REVISE
        old_lines: ['- AC-3: 当前可见列表为空时，点击导出仍能下载 CSV。']
        reason:
          contains: ['批量删除', 'GBK']
          regex: ['(?:空集|为空|空列表|空结果|AC-3)']
      sections:
        '## 验收标准':
          regex: ['(?m)^- AC-3:.*task_id,status.*(?:零行|零数据行|0\s*行|(?:无|没有|不含|不包含|不输出|不写入)(?:任何)?数据行|零条数据|仅保留表头|仅含表头|仅有表头|只有表头)']
          not_contains: ['GBK', '批量删除', 'AC-4']

