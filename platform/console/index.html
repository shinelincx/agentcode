<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交付平台 · 管理控制台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">AC</span>
      <div class="brand-text"><strong>交付平台</strong><span class="brand-sub">管理控制台</span></div>
    </div>

    <label class="proj-pick">
      <span>当前项目</span>
      <select id="project"></select>
    </label>

    <nav class="nav" id="nav">
      <a href="#/overview" data-nav="overview">总览</a>
      <a href="#/tasks" data-nav="tasks">任务<em class="nav-count" id="nav-tasks">-</em></a>
      <a href="#/approvals" data-nav="approvals">待审批<em class="nav-count warn" id="nav-approvals">-</em></a>
      <a href="#/actions" data-nav="actions">操作</a>
      <a href="#/query" data-nav="query">查询</a>
      <a href="#/settings" data-nav="settings">设置</a>
    </nav>

    <div class="side-foot">
      <div class="side-row"><span class="chip" id="mode">只读</span><span class="badge" id="state">-</span></div>
      <div class="meta-text" id="gen">-</div>
      <div class="meta-text mono" id="dbhint">-</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-head"><h1 id="page-title">总览</h1><p class="meta-text" id="page-sub"></p></div>
      <div class="topbar-actions">
        <button class="btn" id="refresh" type="button">刷新</button>
        <a class="btn btn-primary" id="newreq" href="#/actions" hidden>＋ 新建需求</a>
      </div>
    </header>
    <div id="jobbar" class="jobbar" hidden></div>
    <div id="view" class="view"></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="dialog">
    <div class="dialog-head"><b id="m-title">详情</b><button class="btn btn-sm" id="m-close">关闭</button></div>
    <div id="m-body"></div>
  </div>
</div>

<script src="/settings.js"></script>
<script src="/app.js"></script>
</body>
</html>
