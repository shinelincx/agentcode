<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色配置 · 交付平台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">AC</span>
    <div class="brand-text">
      <strong>角色配置</strong>
      <span class="brand-sub mono" id="file">-</span>
    </div>
  </div>
  <div class="topbar-meta"><span class="chip" id="proj">-</span><span class="meta-text" id="modehint"></span></div>
  <div class="topbar-actions"><a class="btn" href="/">← 返回控制台</a></div>
</header>

<main class="form-page wide">
  <div id="msg" class="jobbar" hidden></div>
  <form id="cfg">
    <div style="display:grid;gap:16px">
      <section class="panel"><div class="panel-head"><h2>执行器 · executor</h2></div><div class="fields" id="f-executor"></div></section>
      <section class="panel"><div class="panel-head"><h2>模型路由 · model</h2></div><div class="fields" id="f-model"></div></section>
      <section class="panel"><div class="panel-head"><h2>预算边界 · budget</h2></div><div class="fields" id="f-budget"></div></section>
      <section class="panel"><div class="panel-head"><h2>测试门禁 · test / tech_stack.gate_commands</h2></div><div class="fields" id="f-test"></div></section>
      <section class="panel"><div class="panel-head"><h2>部署 staging · deploy.staging</h2></div><div class="fields" id="f-deploy"></div></section>
      <section class="panel"><div class="panel-head"><h2>审批闸门 · gates</h2></div><div class="fields" id="f-gates"></div></section>
      <section class="panel"><div class="panel-head"><h2>项目路径</h2></div><div class="fields" id="f-paths"></div></section>
    </div>
    <div class="savebar" style="margin-top:16px">
      <button class="btn btn-primary" type="submit" id="save">保存配置</button>
      <span class="hint">保存后立即写入 project.yaml（定点替换、保留注释），并刷新运行时。</span>
    </div>
  </form>

  <section class="panel">
    <div class="panel-head"><h2>最近配置变更 · config-audit.jsonl</h2></div>
    <div id="audit" class="table-wrap"></div>
  </section>
</main>

<script src="/config.js"></script>
</body>
</html>
